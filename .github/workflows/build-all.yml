name: Build All OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Tag release version on main
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$VERSION"
          git push origin "refs/tags/$VERSION" --force

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Tag release version on main
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$VERSION"
          git push origin "refs/tags/$VERSION" --force

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build and Publish Mac
        if: matrix.os == 'macos-latest'
        run: npm run electron:build:mac -- --publish ${{ github.ref == 'refs/heads/main' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Build and Publish Windows
        if: matrix.os == 'windows-latest'
        run: npm run electron:build:win -- --publish ${{ github.ref == 'refs/heads/main' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Build and Publish Linux
        if: matrix.os == 'ubuntu-latest'
        run: npm run electron:build:linux -- --publish ${{ github.ref == 'refs/heads/main' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}


      - name: Upload Mac Artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Restless-Mac-App
          path: |
            release/*.zip

      - name: Upload Windows Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Restless-Windows-App
          path: release/*.exe

      - name: Upload Linux Artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Restless-Linux-App
          path: |
            release/*.AppImage
            release/*.deb
